[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sailing-conditions"
version = "0.1.0"
description = "Quick sailing condition summaries across multiple cities (1–10 rating, Wind / Waves / Sky)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Plummer" }
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sailing-conditions = "sailing_conditions.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sailing_conditions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
