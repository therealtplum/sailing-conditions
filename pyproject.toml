[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sailing-conditions"
version = "2.0.0"
description = "Hourly sailing forecasts from NOAA data, scored for your boat and searched for the window worth sailing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Plummer" }]
keywords = ["sailing", "weather", "forecast", "noaa", "nws", "marine", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16,<0.17",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/therealtplum/sailing-conditions"
Issues = "https://github.com/therealtplum/sailing-conditions/issues"

[project.scripts]
sail = "sailing_conditions.cli:run"
sailing-conditions = "sailing_conditions.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["sailing_conditions*"]

[tool.setuptools.package-data]
sailing_conditions = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sailing_conditions"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # docstrings
    "RUF",
]
ignore = [
    "D105",   # magic methods speak for themselves
    "D107",   # __init__ documented on the class
    "D203",
    "D213",
    "E501",   # line length is handled by the formatter
    "RUF001", # en dashes and degree signs are deliberate typography
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
