# sailing-conditions configuration.
#
# Copy to ~/.config/sailing-conditions/config.toml, or point SAILING_CONFIG at
# it. Preferences live here; credentials never do — those come from the
# environment (SLACK_WEBHOOK_URL, SMTP_*, EMAIL_*, SAILING_CONTACT).

[defaults]
# Used when you do not name a spot or profile on the command line.
profile = "keelboat"
spots = ["chicago"]

# Score an hour must clear to count toward a window, and the shortest run
# worth telling you about. Raise min_score if you only want the good stuff.
min_score = 6.5
min_hours = 2
days = 3

# NOAA asks API clients to identify themselves; SAILING_CONTACT overrides this.
contact = "you@example.com"


# ---------------------------------------------------------------------------
# Your spots. Same schema as the built-ins — see `sail spots` for those.
# Put the coordinates on the water you actually sail, not at the nearest
# post office: NWS grid cells are about 2.5 km, and the lakefront cell is a
# different forecast from the downtown one.
# ---------------------------------------------------------------------------

[spots.myclub]
name = "Columbia YC"
region = "Chicago, IL"
lat = 41.867
lon = -87.606
buoy = "CHII2"                     # optional NDBC station for live conditions
blurb = "Mooring field off Burnham. Shifty in a westerly."
tags = ["home"]


# ---------------------------------------------------------------------------
# Your boat. Anything you leave out is inherited from `extends`
# (default: keelboat), so three lines is a perfectly good profile.
# ---------------------------------------------------------------------------

[profiles.my_j24]
extends = "keelboat"
name = "My J/24"
# min: no point rigging below this. ideal_lo..ideal_hi: the good stuff.
# max: overpowered, and a hard veto.
wind = { min = 6, ideal_lo = 11, ideal_hi = 22, max = 30 }
wave_ok_ft = 2.5                   # past here it stops being comfortable
wave_max_ft = 4.5                  # past here it stops being fun
gust_ratio_ok = 1.3                # gust ÷ sustained you are happy with
thunder_veto_pct = 25              # chance of thunder that calls it off
comfort_f = [64, 90]               # apparent temperature you enjoy

# Relative weight of each factor in the score. Sail a wet boat and care less
# about rain? Drop the precip weight.
[profiles.my_j24.weights]
wind = 3.0
sea = 1.8
gust = 1.2
precip = 0.6
comfort = 0.8
sky = 0.4


# ---------------------------------------------------------------------------
# Watch rules — standing questions, evaluated by `sail watch` from cron or a
# GitHub Action. Each rule notifies once per qualifying forecast date, then
# stays quiet for cooldown_hours.
# ---------------------------------------------------------------------------

[[watch]]
name = "weekday evening sail"
spot = "myclub"
profile = "my_j24"
min_score = 7.5
min_hours = 3
days = 2
channels = ["slack"]
cooldown_hours = 20

[[watch]]
name = "worth driving to Milwaukee"
spot = "milwaukee"
profile = "my_j24"
min_score = 9.0                    # a high bar: this one costs a tank of fuel
min_hours = 4
days = 5
channels = ["slack", "email"]
cooldown_hours = 48
