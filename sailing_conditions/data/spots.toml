# Built-in sailing spots.
#
# Coordinates point at the water you would actually sail on, not at the city
# hall a few miles inland — NWS grids are ~2.5 km, and the difference between
# a lakefront cell and a downtown cell is a real difference in wind.
#
# `buoy` is an NDBC station used for live observations. Every ID here was
# verified against https://www.ndbc.noaa.gov/data/realtime2/ ; some stations
# report wind only, others waves only, and the report degrades gracefully.
#
# Add your own in ~/.config/sailing-conditions/config.toml — same schema.

[spots.chicago]
name = "Belmont Harbor"
region = "Chicago, IL"
lat = 41.939
lon = -87.633
buoy = "CHII2"
blurb = "Lake Michigan. Flat in an offshore westerly, short and steep in a NE blow."
tags = ["great-lakes", "fresh-water"]

