name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # A venv per matrix entry: the runner's own Python is Debian-managed,
      # and installing into it would both fail and test the wrong version.
      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Confirm the interpreter under test
        run: uv run python -c "import sys; print(sys.version)"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy sailing_conditions

      # The suite runs against recorded NOAA payloads, so CI never touches the
      # network — no flaky builds when api.weather.gov has a bad afternoon.
      - name: Test
        run: uv run pytest --cov=sailing_conditions --cov-report=term-missing --cov-fail-under=90

  smoke:
    name: Live API smoke test
    runs-on: ubuntu-latest
    # Fixtures can go stale silently when NOAA changes a payload. This job
    # hits the real API so we find out from CI, not from a user. It is
    # advisory: a NOAA outage should not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - name: Fetch a real forecast
        env:
          SAILING_CONTACT: ${{ secrets.SAILING_CONTACT || 'ci@example.com' }}
        run: uv run sail now chicago --json --compact --no-cache
